<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ghulam Mustafa — AI / ML researcher</title>
  <desc id="desc">Dark technology banner with a cyan and violet neural network, gently pulsing nodes and flowing signals.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#090f1e"/><stop offset="1" stop-color="#15132d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".18"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .pulse { animation: pulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .delay { animation-delay: -2.5s; }
    .signal { stroke-dasharray: 8 24; animation: flow 8s linear infinite; }
    .cursor { animation: blink 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: .85; transform: scale(1.15); } }
    @keyframes flow { to { stroke-dashoffset: -128; } }
    @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse,.signal,.cursor { animation: none; } }
  </style>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="950" cy="180" rx="300" ry="240" fill="url(#halo)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#334155" stroke-opacity=".6"/>
  <rect x="48" y="48" width="34" height="4" rx="2" fill="#22d3ee"/>
  <text x="96" y="55" fill="#94a3b8" font-size="14" letter-spacing="3" font-family="Consolas,monospace">RESEARCH / CODE / CREATE</text>
  <text x="48" y="143" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="700">Ghulam Mustafa</text>
  <text x="50" y="187" fill="#22d3ee" font-family="Consolas,monospace" font-size="21">Exploring intelligent systems.</text>
  <text x="50" y="226" fill="#a1adc1" font-family="Segoe UI,Arial,sans-serif" font-size="18">AI / ML research · Deep learning · NLP</text>
  <rect x="48" y="274" width="414" height="38" rx="8" fill="#0b1222" stroke="#263449"/>
  <text x="64" y="299" fill="#a78bfa" font-family="Consolas,monospace" font-size="14">&gt; learning.building.iterating</text>
  <rect class="cursor" x="310" y="285" width="9" height="16" fill="#22d3ee"/>
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".3">
    <path d="M770 105 900 65 1040 105 1130 180 1040 255 900 295 770 255 900 180 770 105 770 255 M900 65 900 180 900 295 M1040 105 900 180 1040 255 M1040 105 1040 255 M770 105 1040 105 M770 255 1040 255 M900 65 1040 255 M900 295 1040 105"/>
  </g>
  <g class="signal" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".65">
    <path d="M770 105 900 180 1040 105 1130 180"/>
    <path d="M770 255 900 180 1040 255"/>
  </g>
  <g fill="#0d1729" stroke="url(#accent)" stroke-width="2">
    <circle cx="770" cy="105" r="8"/><circle cx="770" cy="255" r="8"/>
    <circle cx="900" cy="65" r="8"/><circle cx="900" cy="295" r="8"/>
    <circle cx="1040" cy="105" r="8"/><circle cx="1040" cy="255" r="8"/><circle cx="1130" cy="180" r="8"/>
    <circle cx="900" cy="180" r="19"/>
  </g>
  <circle class="pulse" cx="900" cy="180" r="35" fill="none" stroke="#22d3ee"/>
  <circle class="pulse delay" cx="1040" cy="105" r="21" fill="none" stroke="#a78bfa"/>
  <circle cx="900" cy="180" r="6" fill="#22d3ee"/>
  <text x="820" y="335" fill="#64748b" font-size="11" letter-spacing="3" font-family="Consolas,monospace">CONNECT IDEAS. BUILD SYSTEMS.</text>
</svg>
